version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      compose:
        patterns: ["androidx.compose*","androidx.activity*","androidx.lifecycle*"]
        update-types: ["minor","patch"]
      room:
        patterns: ["androidx.room*"]
        update-types: ["minor","patch"]
      network:
        patterns: ["com.squareup.retrofit2*","com.squareup.okhttp3*"]
        update-types: ["minor","patch"]
    labels: ["dependencies","gradle"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor","patch","major"]
    labels: ["dependencies","github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"
